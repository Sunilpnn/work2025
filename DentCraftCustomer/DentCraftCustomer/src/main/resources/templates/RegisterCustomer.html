
<html>
 <head>

 <title>Register New  Customer</title>
   
 <style>

body {
    background-image: url("https://wallpapercave.com/wp/wp15026320.webp");
    background-color: #f4f4f4;
    font-family: Arial, sans-serif;
}

/* Form Box */
form {
    width: 350px;
    margin: 80px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

/* Input fields */
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    background-color: #3267a0;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

 </style>   
    

</head>
<body>

    <form th:action="@{/customers/createCustomer}" method="post">
<input type="text" name="name" placeholder="Enter Name" />

<input type="number" name="age" placeholder="Enter Age" />


<input type="email" name="email" placeholder="Enter Email" />

<input type = "tel" name ="phone" placeholder = "Phone" />

<input type = "submit" value = "Save" />
<input type = "reset" value = "Clear" />

<div style="margin-top: 15px; text-align: center;">
            <a th:href="@{/customers/home}" style="text-decoration: none; color: #3267a0; font-weight: bold;">← Back to Home</a>
        </div> 
    
</form>

</body>
</html>
